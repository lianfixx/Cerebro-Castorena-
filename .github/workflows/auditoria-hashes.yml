name: Auditoría de hashes del cerebro

# Sin IA y sin costo. Recalcula el SHA-256 de cada archivo de cerebro/fuentes/ y comprueba que
# MATRIZ.json, HISTORIAL.json, SINCRONIZACION.json, ESTADO.json y el último cierre digan lo mismo
# (cerebro/skill/scripts/auditar_hashes.py). Corre cuando cambia cerebro/ en main, cada día a las
# 19:20 (hora del centro de México, después del cierre diario de las 18:44) y a mano.
# Si encuentra un error, la corrida queda en rojo y abre (o actualiza) un aviso en Issues.
# No escribe en el repositorio ni envía correos. Solo lee.
on:
  push:
    branches: [main]
    paths: ["cerebro/**"]
  schedule:
    - cron: "20 1 * * *" # 19:20 CDMX (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: auditoria-hashes
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validador de la matriz
        run: python3 cerebro/skill/scripts/validar_matriz.py cerebro > "$RUNNER_TEMP/validar.json"
      - name: Auditoría de hashes y coherencia
        run: python3 cerebro/skill/scripts/auditar_hashes.py cerebro --json "$RUNNER_TEMP/auditoria.json" > /dev/null
      - name: Resumen
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "auditoria.json"
          if not p.exists():
              print("La auditoría no produjo informe: revisar el validador de la matriz.")
          else:
              r = json.loads(p.read_text())
              print("## Auditoría de hashes:", r["resultado"])
              print("Conteos:", r["conteos"])
              for clave in ("errores", "avisos"):
                  print("\n###", clave.capitalize(), len(r[clave]))
                  for x in r[clave]:
                      print("-", x["control"], "·", x["donde"], "·", x["detalle"])
          PY
      - name: Avisar si hay errores
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Auditoría de hashes: hay errores en el cerebro"
          cuerpo="La auditoría automática encontró errores. Detalle en el resumen de la corrida: $RUN_URL

          Qué hacer: abrir la corrida, leer la lista de errores y corregir el registro o restaurar el archivo. Las fuentes de cerebro/fuentes/ no se modifican."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$titulo in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$cuerpo"; fi
